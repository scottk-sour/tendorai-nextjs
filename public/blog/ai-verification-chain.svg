<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" style="width:100%;height:auto;max-width:680px;display:block;margin:0 auto">
<title>The AI Verification Chain — how an AI assistant resolves a UK law firm to a recommendation</title>
<desc>Four authoritative sources — SRA register, Companies House, your website and directories — feed an entity-resolution check. When the sources agree the firm is recommended; when they conflict the firm is excluded.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="40" y="26" font-size="12" fill="#5F5E5A">Authoritative sources</text>
<rect x="40" y="40" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="115" y="62" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">SRA register</text>
<rect x="40" y="98" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="115" y="120" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Companies House</text>
<rect x="40" y="156" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="115" y="178" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Your website</text>
<rect x="40" y="214" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="115" y="236" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Directories</text>
<line x1="190" y1="62" x2="250" y2="134" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="120" x2="250" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="178" x2="250" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="236" x2="250" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="252" y="121" width="208" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="356" y="142" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Entity resolution</text>
<text x="356" y="161" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Do your sources agree?</text>
<line x1="460" y1="138" x2="500" y2="102" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="162" x2="500" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500" y="74" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="570" y="95" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Recommended</text><text x="570" y="113" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">sources agree</text>
<rect x="500" y="168" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="570" y="189" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Excluded</text><text x="570" y="207" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">sources conflict</text>
</svg>
