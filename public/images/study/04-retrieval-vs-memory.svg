<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif'>
  <rect width='1200' height='675' fill='#ffffff'/>
  <text x='600' y='95' text-anchor='middle' font-size='38' font-weight='700' fill='#1e293b'>Two kinds of AI behave differently</text>
  <text x='600' y='140' text-anchor='middle' font-size='22' fill='#64748b'>Your visibility strategy only works on one of them</text>

  <!-- Left panel: retrieval-based AI -->
  <g>
    <rect x='70' y='175' width='510' height='380' rx='14' fill='#f5f3ff' stroke='#7c3aed' stroke-width='2'/>
    <text x='100' y='225' font-size='15' font-weight='700' fill='#7c3aed' letter-spacing='2'>RETRIEVAL-BASED</text>
    <text x='100' y='265' font-size='30' font-weight='700' fill='#1e293b'>Searches the live web</text>
    <text x='100' y='300' font-size='18' fill='#64748b'>ChatGPT search · Perplexity · Claude search</text>

    <text x='100' y='370' font-size='22' font-weight='700' fill='#1e293b'>Names specific firms.</text>
    <text x='100' y='405' font-size='17' fill='#64748b'>Pulls real, current data.</text>
    <text x='100' y='430' font-size='17' fill='#64748b'>Recommendations are decided by</text>
    <text x='100' y='455' font-size='17' fill='#64748b'>retrievable, consistent information.</text>

    <g transform='translate(100, 495)'>
      <circle cx='10' cy='10' r='10' fill='#7c3aed'/>
      <path d='M 6 10 L 9 13 L 14 7' stroke='#fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/>
      <text x='30' y='15' font-size='17' font-weight='600' fill='#1e293b'>Your data work matters here</text>
    </g>
  </g>

  <!-- Right panel: memory-only AI -->
  <g>
    <rect x='620' y='175' width='510' height='380' rx='14' fill='#f8fafc' stroke='#cbd5e1' stroke-width='2'/>
    <text x='650' y='225' font-size='15' font-weight='700' fill='#64748b' letter-spacing='2'>MEMORY-ONLY</text>
    <text x='650' y='265' font-size='30' font-weight='700' fill='#1e293b'>Answers from training</text>
    <text x='650' y='300' font-size='18' fill='#64748b'>No live search · Cut-off date</text>

    <text x='650' y='370' font-size='22' font-weight='700' fill='#1e293b'>Refuses to name firms.</text>
    <text x='650' y='405' font-size='17' fill='#64748b'>&ldquo;I don't have reliable, current</text>
    <text x='650' y='430' font-size='17' fill='#64748b'>knowledge of specific firms.&rdquo;</text>

    <g transform='translate(650, 495)'>
      <circle cx='10' cy='10' r='10' fill='#64748b'/>
      <text x='6' y='15' font-size='14' font-weight='700' fill='#fff'>—</text>
      <text x='30' y='15' font-size='17' font-weight='600' fill='#1e293b'>Visibility work has no effect</text>
    </g>
  </g>
</svg>